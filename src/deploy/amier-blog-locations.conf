location = /editor {
    return 302 https://amier.ge/editor/;
}

location /editor/ {
    if ($host != amier.ge) { return 302 https://amier.ge$request_uri; }
    proxy_pass http://127.0.0.1:18742;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/editor/login {
    limit_req zone=amier_blog_signin burst=8 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:18742;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/editor/ {
    client_max_body_size 25m;
    proxy_read_timeout 65s;
    proxy_pass http://127.0.0.1:18742;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/visitors/stats {
    proxy_pass http://127.0.0.1:18742;
    proxy_set_header Host $host;
}

location = /api/visitors/visit {
    limit_req zone=amier_blog_visits burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:18742;
    proxy_set_header Host $host;
}
